<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0f2740"/>
    </linearGradient>
  </defs>
  <!-- Navy rounded-square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Orange accent bar at top -->
  <rect x="80" y="56" width="352" height="6" rx="3" fill="#E8792B" opacity="0.6"/>
  <!-- S letter -->
  <text x="118" y="370" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="320" fill="#E8792B">S</text>
  <!-- P letter -->
  <text x="280" y="370" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="320" fill="white">P</text>
</svg>
